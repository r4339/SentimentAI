name: CI SentimentAI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- Job 1 : vérification du code ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # (train_model.py et pytest seront ajoutés ici plus tard)

  # ---------- Job 2 : construction et publication de l'image ----------
  docker:
    needs: build                      # ne démarre que si "build" a réussi
    runs-on: ubuntu-latest
    if: github.event_name == 'push'   # on publie seulement sur un push, pas sur une PR

    permissions:
      contents: read
      packages: write                 # autorise l'écriture dans GHCR

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Générer le nom et les tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max